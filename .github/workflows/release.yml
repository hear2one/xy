name: Build release installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build installers
        run: bash .github/scripts/build-install.sh

      - name: Build dual CDN extension
        run: bash .github/scripts/build-dual-cdn.sh

      - name: Build dual IP extension
        run: bash .github/scripts/build-dual-ip.sh

      - name: Build QUIC extension
        run: bash .github/scripts/build-quic.sh

      - name: Build Hysteria2 extension
        run: bash .github/scripts/build-hysteria2.sh

      - name: Build standalone Reality installer and extension
        run: |
          bash .github/scripts/build-xhttp-reality.sh
          bash .github/scripts/build-xhttp-reality-direct.sh

      - name: Validate generated installers
        run: bash .github/scripts/check.sh

      - name: Generate checksums
        run: |
          cd dist
          sha256sum *.sh > SHA256SUMS

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers
          path: |
            dist/*.sh
            dist/SHA256SUMS

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/*.sh
            dist/SHA256SUMS
